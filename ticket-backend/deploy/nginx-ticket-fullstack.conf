server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maintenance.pydah.edu.in ticket-maintenance-backend.pydah.edu.in;

    ssl_certificate /etc/letsencrypt/live/ticket-maintenance-backend.pydah.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticket-maintenance-backend.pydah.edu.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    root /var/www/ticket-app;
    index index.html;

    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5001/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name maintenance.pydah.edu.in ticket-maintenance-backend.pydah.edu.in;

    return 301 https://$host$request_uri;
}

